<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schoolonsim</title>
<style>
  :root{
    --bg:#0f1b2d;
    --bg-soft:#16273f;
    --panel:#1c2f4e;
    --panel-light:#24406a;
    --accent:#ffb545;
    --accent2:#3fd0c9;
    --accent3:#ff6b8b;
    --text:#eaf1fb;
    --text-dim:#9db1cc;
    --good:#4ade80;
    --bad:#f87171;
    --radius:18px;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);min-height:100vh;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(63,208,201,.12), transparent 40%),
      radial-gradient(circle at 100% 20%, rgba(255,181,69,.10), transparent 45%),
      var(--bg);
    padding-bottom:90px;
  }
  #app{max-width:640px;margin:0 auto;padding:16px 14px 8px;}

  /* Topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1200;font-size:16px;box-shadow:var(--shadow);}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:var(--text-dim);margin-top:-2px;}
  .day-pill{background:var(--panel);border:1px solid var(--panel-light);padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;color:var(--accent2);}

  /* Cards */
  .card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.04);}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--text-dim);font-weight:700;}
  .card h3{margin:0 0 6px;font-size:18px;font-weight:800;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-box{background:var(--bg-soft);border-radius:14px;padding:10px 8px;text-align:center;}
  .stat-box .val{font-size:18px;font-weight:800;color:var(--accent);}
  .stat-box .lbl{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

  .progress-track{width:100%;height:8px;border-radius:100px;background:var(--bg-soft);overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:100px;transition:width .4s ease;}

  .btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .1s ease,filter .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent2),#2aa89f);color:#052321;}
  .btn-accent{background:linear-gradient(135deg,var(--accent),#e08e1e);color:#241300;}
  .btn-pink{background:linear-gradient(135deg,var(--accent3),#c94465);color:#2a0410;}
  .btn-ghost{background:var(--bg-soft);color:var(--text);border:1px solid var(--panel-light);}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .lesson-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg-soft);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .lesson-item .subj{font-weight:700;font-size:14px;}
  .lesson-item .topic{font-size:11.5px;color:var(--text-dim);}
  .badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;}
  .badge-belum{background:rgba(255,181,69,.15);color:var(--accent);}
  .badge-selesai{background:rgba(74,222,128,.15);color:var(--good);}
  .badge-proses{background:rgba(63,208,201,.15);color:var(--accent2);}

  /* Nav */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,32,52,.97);backdrop-filter:blur(8px);border-top:1px solid var(--panel-light);display:flex;justify-content:center;z-index:40;}
  .nav-inner{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(6,1fr);}
  .nav-btn{background:none;border:none;color:var(--text-dim);padding:10px 2px 8px;font-size:9.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .nav-btn.active{color:var(--accent2);}
  .nav-icon{width:20px;height:20px;}

  .view{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .subject-tag{display:inline-block;background:var(--panel-light);color:var(--accent2);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;margin-bottom:8px;}
  .explain-box{background:var(--bg-soft);border-left:3px solid var(--accent2);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5;margin-bottom:10px;}
  .example-box{background:var(--bg-soft);border-left:3px solid var(--accent);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5;margin-bottom:14px;}
  .example-box b{color:var(--accent);}

  .q-num{font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .q-text{font-size:15px;font-weight:700;margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;background:var(--bg-soft);border:1.5px solid var(--panel-light);color:var(--text);border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:13.5px;cursor:pointer;}
  .opt.selected{border-color:var(--accent2);background:rgba(63,208,201,.12);}
  .opt.correct{border-color:var(--good);background:rgba(74,222,128,.15);}
  .opt.wrong{border-color:var(--bad);background:rgba(248,113,113,.15);}

  .result-circle{width:90px;height:90px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;background:conic-gradient(var(--accent2) calc(var(--pct)*1%), var(--bg-soft) 0);}
  .result-circle span{background:var(--panel);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .menu-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .menu-item .name{font-size:14px;font-weight:700;}
  .menu-item .meta{font-size:11px;color:var(--text-dim);}
  .menu-item .price{font-size:13px;font-weight:800;color:var(--accent);}
  .nutri-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;margin-left:6px;}
  .nutri-sehat{background:rgba(74,222,128,.15);color:var(--good);}
  .nutri-sedang{background:rgba(255,181,69,.15);color:var(--accent);}
  .nutri-kurang{background:rgba(248,113,113,.15);color:var(--bad);}

  .announce{background:var(--bg-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.45;border-left:3px solid var(--accent3);}
  .task-item{background:var(--bg-soft);border-radius:14px;padding:12px;margin-bottom:10px;}
  .task-item .subj{font-size:11.5px;color:var(--accent2);font-weight:700;}
  .task-item p{font-size:13px;margin:6px 0 10px;line-height:1.45;}

  input[type=text],input[type=number]{width:100%;background:var(--bg-soft);border:1.5px solid var(--panel-light);color:var(--text);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:10px;}
  label.field-label{font-size:12px;color:var(--text-dim);font-weight:700;display:block;margin-bottom:5px;}

  .cal-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
  .cal-day{background:var(--bg-soft);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);}
  .cal-day.active{background:linear-gradient(135deg,var(--accent2),#2aa89f);color:#052321;}

  .hist-item{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--bg-soft);}
  .hist-item:last-child{border-bottom:none;}

  .empty-note{font-size:12.5px;color:var(--text-dim);text-align:center;padding:14px 0;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--panel-light);color:var(--text);padding:10px 18px;border-radius:100px;font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;}
  .toast.show{opacity:1;bottom:112px;}
</style>
</head>

/* ======================= STATE ======================= */
const STORAGE_KEY = "mufdexSchoolData_v1";
const SCHEMA_VERSION = 2; // v2: soal & pilihan jawaban diacak per sesi, jawaban dicocokkan lewat isi bukan indeks tetap

function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    profile:{ nama:"Siswa Baru", kelas:"6" },
    dayCounter:0,
    lastAllowanceCounter:-1,
    saldo:0, tabungan:0,
    transaksi:[],
    xp:0, level:1, iq:100,
    quizHistory:[],
    absensi:{ hadir:0, tidakHadir:0 },
    tugas:[],
    materiPointer:{},
    today:null
  };
}
let state = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
    else state = defaultState();
  }catch(e){ state = defaultState(); }
  // fallback untuk data lama yang mungkin belum punya field baru, supaya tidak hilang
  if(!state.materiPointer) state.materiPointer = {};
  if(!state.tugas) state.tugas = [];
  if(!state.transaksi) state.transaksi = [];
  if(!state.quizHistory) state.quizHistory = [];
  if(!state.absensi) state.absensi = { hadir:0, tidakHadir:0 };
  if(typeof state.saldo !== "number") state.saldo = 0;
  if(typeof state.tabungan !== "number") state.tabungan = 0;
  if(typeof state.xp !== "number") state.xp = 0;
  if(typeof state.iq !== "number") state.iq = 100;
  if(!state.profile) state.profile = { nama:"Siswa Baru", kelas:"6" };

  if(!state.today) generateDay(state.dayCounter, true);
  // migrasi: perbaiki sesi soal lama yang belum diacak (bug jawaban selalu di posisi pertama)
  if(state.schemaVersion !== SCHEMA_VERSION){
    migrateShuffleFix();
    state.schemaVersion = SCHEMA_VERSION;
  }
  saveState();
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// perbaikan data lama: susun ulang soal pelajaran yang belum selesai dengan pilihan teracak,
// pelajaran yang sudah selesai (nilainya) tidak diutak-atik supaya riwayat tidak berubah
function migrateShuffleFix(){
  if(!state.today || !state.today.lessons) return;
  state.today.lessons = state.today.lessons.map(l=>{
    if(l.stage === "selesai") return l;
    const bank = MATERI[l.subject] || [];
    const original = bank.find(m=>m.judul===l.judul);
    const rawSoal = original ? original.soal : l.soal;
    return { ...l, soal: buildShuffledSoal(rawSoal), stage:"intro", currentQ:0, answers:[], benar:0 };
  });
}

/* ======================= DAY GENERATION ======================= */
function nextMateriFor(subjectKey){
  const list = MATERI[subjectKey];
  const idx = (state.materiPointer[subjectKey] || 0) % list.length;
  state.materiPointer[subjectKey] = idx + 1;
  return {...list[idx], _idx:idx};
}

// Mengacak urutan 5 soal + posisi pilihan jawaban untuk setiap soal.
// Jawaban benar dilacak lewat ISI teks jawaban, bukan indeks lama, jadi tetap akurat setelah diacak.
function buildShuffledSoal(rawSoal){
  const shuffledOrder = shuffle(rawSoal); // urutan soal berbeda tiap sesi
  return shuffledOrder.map(([question, options, correctIdx])=>{
    const correctText = options[correctIdx];
    const newOptions = shuffle(options); // posisi pilihan A/B/C/D diacak, bukan pola tetap
    const newCorrectIdx = newOptions.indexOf(correctText);
    return [question, newOptions, newCorrectIdx];
  });
}

function generateDay(counter, isInit){
  const dayIndex = counter % 5;
  const dayName = DAYS[dayIndex];
  const subjects = SCHEDULE[dayName];
  const lessons = subjects.map(sub=>{
    const m = nextMateriFor(sub);
    return { subject:sub, judul:m.judul, penjelasan:m.penjelasan, contoh:m.contoh, soal:buildShuffledSoal(m.soal),
      stage:"intro", currentQ:0, answers:[], benar:0 };
  });
  const canteen = CANTEEN_MENUS[counter % CANTEEN_MENUS.length];
  const announcement = ANNOUNCEMENTS[counter % ANNOUNCEMENTS.length];
  const activity = ACTIVITIES[counter % ACTIVITIES.length];

  state.today = { counter, dayIndex, dayName, lessons, canteen, announcement, activity, attended:false };

  // uang saku sekali per hari
  if(state.lastAllowanceCounter !== counter){
    state.saldo += 20000;
    state.lastAllowanceCounter = counter;
  }
  // tugas setiap 2 hari sekali (hari ganjil dalam hitungan counter)
  if(counter % 2 === 1){
    const targetLesson = lessons[lessons.length-1];
    state.tugas.push({
      id:"tugas-"+counter,
      subject:targetLesson.subject,
      judul:targetLesson.judul,
      deskripsi:"Buatlah rangkuman singkat (minimal 5 kalimat) tentang materi \""+targetLesson.judul+"\" yang dipelajari hari ini pada mata pelajaran "+SUBJECT_NAMES[targetLesson.subject]+".",
      status:"belum",
      dayCounter:counter
    });
  }
  // absensi hadir otomatis saat hari baru dimulai
  state.absensi.hadir += 1;
}

function goToNextDay(){
  generateDay(state.dayCounter + 1);
  state.dayCounter += 1;
  saveState();
  render();
  showToast("Hari berganti menjadi "+state.today.dayName+"! Uang saku Rp20.000 masuk.");
}

/* ======================= HELPERS ======================= */
function rupiah(n){ return "Rp"+Number(n).toLocaleString("id-ID"); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function addXP(n){
  state.xp += n;
  state.level = Math.floor(state.xp/150)+1;
}
function addIQ(n){
  state.iq = Math.max(60, Math.min(200, state.iq + n));
}

/* ======================= RENDER: KELAS (ALUR BELAJAR) ======================= */
function viewKelas(){
  const t = state.today;
  const lesson = t.lessons[lessonActiveIndex];
  if(!lesson){
    return `<div class="view"><div class="card"><h2>Kelas</h2><div class="empty-note">Semua pelajaran hari ini sudah selesai! Kembali ke Beranda untuk lanjut ke hari berikutnya.</div></div></div>`;
  }

  let body = "";
  if(lesson.stage === "intro"){
    body = `
      <span class="subject-tag">${SUBJECT_NAMES[lesson.subject]}</span>
      <h3>${lesson.judul}</h3>
      <div class="explain-box"><b>Penjelasan Guru:</b><br>${lesson.penjelasan}</div>
      <div class="example-box"><b>Contoh:</b><br>${lesson.contoh}</div>
      <button class="btn btn-primary btn-block" onclick="startLatihan(${lessonActiveIndex})">Mulai Latihan (5 Soal)</button>
    `;
  } else if(lesson.stage === "soal"){
    const q = lesson.soal[lesson.currentQ];
    const answered = lesson.answers[lesson.currentQ] !== undefined;
    body = `
      <span class="subject-tag">${SUBJECT_NAMES[lesson.subject]}</span>
      <div class="q-num">Soal ${lesson.currentQ+1} dari 5</div>
      <div class="progress-track"><div class="progress-fill" style="width:${(lesson.currentQ)/5*100}%"></div></div>
      <div class="q-text" style="margin-top:12px;">${q[0]}</div>
      ${q[1].map((opt,i)=>{
        let cls="opt";
        if(answered){
          if(i===q[2]) cls+=" correct";
          else if(i===lesson.answers[lesson.currentQ]) cls+=" wrong";
        }
        return `<button class="${cls}" ${answered?'disabled':''} onclick="answerLatihan(${lessonActiveIndex},${i})">${opt}</button>`;
      }).join("")}
      ${answered?`<button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="nextSoal(${lessonActiveIndex})">${lesson.currentQ<4?'Soal Berikutnya':'Lihat Hasil'}</button>`:""}
    `;
  } else if(lesson.stage === "selesai"){
    const pct = Math.round(lesson.benar/5*100);
    const hasNext = lessonActiveIndex < t.lessons.length-1;
    body = `
      <span class="subject-tag">${SUBJECT_NAMES[lesson.subject]}</span>
      <h3>Hasil Latihan: ${lesson.judul}</h3>
      <div class="result-circle" style="--pct:${pct}"><span>${pct}%</span></div>
      <p style="text-align:center;font-size:13.5px;color:var(--text-dim);">Kamu menjawab benar ${lesson.benar} dari 5 soal.</p>
      ${hasNext?`<button class="btn btn-primary btn-block" onclick="lessonActiveIndex=${lessonActiveIndex+1};render()">Lanjut ke Pelajaran Berikutnya</button>`:
      `<button class="btn btn-accent btn-block" onclick="setView('dashboard')">Kembali ke Beranda</button>`}
    `;
  }

  return `<div class="view"><div class="card">${body}</div></div>`;
}

function startLatihan(i){
  const l = state.today.lessons[i];
  l.stage="soal"; l.currentQ=0; l.answers=[]; l.benar=0;
  saveState(); render();
}
function answerLatihan(i, optIdx){
  const l = state.today.lessons[i];
  if(l.answers[l.currentQ] !== undefined) return;
  l.answers[l.currentQ] = optIdx;
  const correct = l.soal[l.currentQ][2] === optIdx;
  if(correct){ l.benar++; addXP(5); addIQ(1); }
  saveState(); render();
}
function nextSoal(i){
  const l = state.today.lessons[i];
  if(l.currentQ < 4){ l.currentQ++; }
  else { l.stage="selesai"; }
  saveState(); render();
}
window.startLatihan=startLatihan; window.answerLatihan=answerLatihan; window.nextSoal=nextSoal;

/* ======================= RENDER: KUIS ======================= */
function buildQuizPool(){
  const pool = [];
  Object.keys(MATERI).forEach(sub=>{
    MATERI[sub].forEach(m=>{
      m.soal.forEach(s=> pool.push({subject:sub, judul:m.judul, q:s[0], opts:s[1], ans:s[2]}));
    });
  });
  return pool;
}
function viewKuis(){
  if(!quizState){
    return `<div class="view">
      <div class="card">
        <h2>Ujian / Kuis Campuran</h2>
        <h3>Uji semua pelajaran</h3>
        <p style="font-size:13px;color:var(--text-dim);line-height:1.5;">Kuis berisi 10 soal acak dari seluruh mata pelajaran Kelas 6 SD. Soal akan diacak setiap kali kamu memulai kuis baru.</p>
        <button class="btn btn-primary btn-block" onclick="startQuiz()">Mulai Kuis</button>
      </div>
      ${state.quizHistory.length? `<div class="card"><h2>Riwayat Nilai</h2>
        ${state.quizHistory.slice(-8).reverse().map(h=>`
          <div class="hist-item"><span>${h.tanggal}</span><span><b>${h.skor}</b> (${h.benar} benar / ${h.salah} salah)</span></div>`).join("")}
      </div>`:`<div class="card"><div class="empty-note">Belum ada riwayat kuis.</div></div>`}
    </div>`;
  }
  if(quizState.finished){
    const pct = quizState.score;
    return `<div class="view"><div class="card">
      <h2>Hasil Kuis</h2>
      <div class="result-circle" style="--pct:${pct}"><span>${pct}</span></div>
      <p style="text-align:center;font-size:13.5px;color:var(--text-dim);">Benar: ${quizState.benar} &middot; Salah: ${quizState.salah} &middot; +${quizState.xpGain} XP</p>
      <button class="btn btn-primary btn-block" onclick="quizState=null;render()">Selesai</button>
    </div></div>`;
  }
  const total = quizState.questions.length;
  const answeredCount = quizState.answers.filter(a=>a!==undefined).length;
  return `<div class="view"><div class="card">
    <h2>Kuis Campuran &middot; ${answeredCount}/${total} terjawab</h2>
    ${quizState.questions.map((q,qi)=>`
      <div style="margin-bottom:16px;">
        <div class="q-num">Soal ${qi+1} &middot; ${SUBJECT_NAMES[q.subject]}</div>
        <div class="q-text">${q.q}</div>
        ${q.opts.map((opt,oi)=>`
          <button class="opt ${quizState.answers[qi]===oi?'selected':''}" onclick="selectQuizAnswer(${qi},${oi})">${opt}</button>
        `).join("")}
      </div>
    `).join("")}
    <button class="btn btn-accent btn-block" ${answeredCount<total?'disabled':''} onclick="submitQuiz()">Kumpulkan Jawaban</button>
    ${answeredCount<total?`<div class="empty-note">Jawab semua soal untuk mengumpulkan.</div>`:""}
  </div></div>`;
}
function startQuiz(){
  // acak urutan soal, ambil 10 tanpa duplikat, lalu acak posisi pilihan jawaban tiap soal
  const picked = shuffle(buildQuizPool()).slice(0,10);
  const pool = picked.map(q=>{
    const correctText = q.opts[q.ans];
    const newOpts = shuffle(q.opts);
    const newAns = newOpts.indexOf(correctText);
    return { ...q, opts:newOpts, ans:newAns };
  });
  quizState = { questions:pool, answers:new Array(pool.length).fill(undefined), finished:false };
  render();
}
function selectQuizAnswer(qi,oi){
  quizState.answers[qi]=oi;
  render();
}
function submitQuiz(){
  let benar=0;
  quizState.questions.forEach((q,i)=>{ if(quizState.answers[i]===q.ans) benar++; });
  const salah = quizState.questions.length-benar;
  const score = Math.round(benar/quizState.questions.length*100);
  const xpGain = benar*8;
  addXP(xpGain); addIQ(Math.round(benar/2));
  state.quizHistory.push({ tanggal: state.today.dayName+" (Hari ke-"+(state.dayCounter+1)+")", skor:score, benar, salah, xp:xpGain });
  if(state.quizHistory.length>30) state.quizHistory = state.quizHistory.slice(-30);
  quizState.finished = true; quizState.score = score; quizState.benar = benar; quizState.salah = salah; quizState.xpGain = xpGain;
  saveState(); render();
}
window.startQuiz=startQuiz; window.selectQuizAnswer=selectQuizAnswer; window.submitQuiz=submitQuiz;

          </div>

            <div class="price">${rupiah(item.p)}</div>

function buyFood(i){
  const item = state.today.canteen[i];
  if(state.saldo < item.p){ showToast("Saldo tidak cukup!"); return; }
  state.saldo -= item.p;
  addIQ(item.iq);
  state.transaksi.push({ ket:"Beli "+item.n, jumlah:-item.p, hari:state.today.dayName+" (Hari ke-"+(state.dayCounter+1)+")" });
  if(state.transaksi.length>50) state.transaksi = state.transaksi.slice(-50);
  saveState(); render();
  showToast("Berhasil membeli "+item.n);
}

function viewTabungan(){
  const tugasBelum = state.tugas.filter(t=>t.status==="belum");
  const tugasSelesai = state.tugas.filter(t=>t.status==="sudah dikirim");
  return `<div class="view">
    <div class="card">
      <h2>Dompet & Tabungan</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="val">${rupiah(state.saldo)}</div><div class="lbl">Saldo Kantong</div></div>

      </div>
      <label class="field-label" style="margin-top:14px;">Jumlah (Rp)</label>
      <input type="number" id="amountInput" placeholder="Contoh: 5000" min="0">
      <div class="btn-row">
        <button class="btn btn-primary btn-block" onclick="doSavings('nabung')">Menabung</button>
        <button class="btn btn-pink btn-block" onclick="doSavings('ambil')">Ambil Tabungan</button>
      </div>
    </div>

    <div class="card">
      <h2>Riwayat Transaksi</h2>
      ${state.transaksi.length? state.transaksi.slice(-10).reverse().map(tr=>`
        <div class="hist-item"><span>${tr.ket}<br><span style="color:var(--text-dim);font-size:11px;">${tr.hari}</span></span>
        <span style="color:${tr.jumlah<0?'var(--bad)':'var(--good)'};font-weight:700;">${tr.jumlah<0?'-':'+'}${rupiah(Math.abs(tr.jumlah))}</span></div>
      `).join("") : `<div class="empty-note">Belum ada transaksi.</div>`}
    </div>

    <div class="card">
      <h2>Tugas Sekolah</h2>
      ${state.tugas.length===0? `<div class="empty-note">Belum ada tugas.</div>` : ""}
      ${tugasBelum.map(tg=>`
        <div class="task-item">
          <div class="subj">${SUBJECT_NAMES[tg.subject]}</div>
          <p>${tg.deskripsi}</p>
          <button class="btn btn-primary btn-block" onclick="submitTugas('${tg.id}')">Tandai Sudah Dikirim</button>
        </div>`).join("")}
      ${tugasSelesai.map(tg=>`
        <div class="task-item" style="opacity:.6;">
          <div class="subj">${SUBJECT_NAMES[tg.subject]}</div>
          <p>${tg.deskripsi}</p>
          <span class="badge badge-selesai">Sudah dikirim</span>
        </div>`).join("")}
    </div>
  </div>`;
}
function doSavings(type){
  const input = document.getElementById("amountInput");
  const amount = parseInt(input.value);
  if(!amount || amount<=0){ showToast("Masukkan jumlah yang valid"); return; }
  if(type==="nabung"){
    if(state.saldo < amount){ showToast("Saldo tidak cukup"); return; }
    state.saldo -= amount; state.tabungan += amount;
    state.transaksi.push({ket:"Menabung", jumlah:-amount, hari:state.today.dayName+" (Hari ke-"+(state.dayCounter+1)+")"});
    showToast("Berhasil menabung "+rupiah(amount));
  } else {
    if(state.tabungan < amount){ showToast("Tabungan tidak cukup"); return; }
    state.tabungan -= amount; state.saldo += amount;
    state.transaksi.push({ket:"Ambil tabungan", jumlah:amount, hari:state.today.dayName+" (Hari ke-"+(state.dayCounter+1)+")"});
    showToast("Berhasil mengambil "+rupiah(amount));
  }
  if(state.transaksi.length>50) state.transaksi = state.transaksi.slice(-50);
  saveState(); render();
}
function submitTugas(id){
  const tg = state.tugas.find(t=>t.id===id);
  if(tg){ tg.status="sudah dikirim"; addXP(15); saveState(); render(); showToast("Tugas dikumpulkan! +15 XP"); }
}
window.doSavings=doSavings; window.submitTugas=submitTugas;
